[project]
name = "claude-phone"
version = "0.1.0"
description = "A desk phone line between you and your Claude Code sessions"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9", "mcp>=2.3,<3", "pyobjc-framework-EventKit>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phone = "claude_phone.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claude_phone"]

[tool.setuptools.package-data]
claude_phone = ["siri.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
